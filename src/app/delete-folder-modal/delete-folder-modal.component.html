<div
  #modal
  class="modal fade"
  id="changeNameRA"
  aria-labelledby="newModalLabel"
  aria-hidden="false"
>
  <div class="modal-dialog modal-xl" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="newModalLabel">Delete Folder</h5>
        <button
          class="btn btn-danger btn-sm"
          data-bs-dismiss="modal"
          aria-label="Cancel"
        >
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <div class="row g-3 align-items-center">
          <div class="col-auto">
            <label for="model_name" class="col-form-label label_name"
              >Are you sure you want to delete this folder and all its contents?</label
            >
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-nam-bad" data-bs-dismiss="modal">
          Cancel
        </button>
        <button
          type="button"
          class="btn btn-ets-do"
          data-bs-dismiss="modal"
          (click)="deleteFolder()"
        >
          Delete
        </button>
      </div>
    </div>
  </div>
</div>
